name: Terraform PR Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-pr:
    name: Terraform PR Validation and Security Scan
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        working-directory: github-actionsTry-21-08/parent-modules

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Version
        run: terraform version

      - name: Gitleaks Secret Scan
        working-directory: .
        run: gitleaks detect --source . --redact

      - name: TruffleHog Secret Scan
        working-directory: .
        run: trufflehog filesystem . --results=verified,unknown

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: tfsec Scan
        working-directory: .
        run: tfsec github-actionsTry-21-08/parent-modules

      - name: Terrascan Scan
        working-directory: .
        run: terrascan scan -i terraform -d github-actionsTry-21-08/parent-modules

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan